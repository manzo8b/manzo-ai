# Configuration reference for a PRIVATE, disabled-by-default prototype.
# No GitHub Actions job deploys this Worker. Do not add public routes.
name = "manzo-ai-mission-copilot-preview"
main = "worker.mjs"
compatibility_date = "2026-11-18"
workers_dev = false

# No Worker request/payload logging during the private trial.
# Verify account-level settings independently before activation.
[observability]
enabled = false

[observability.logs]
invocation_logs = false

[ai]
binding = "AI"

[vars]
COPILOT_ENABLED = "false"
FREE_PLAN_CONFIRMED = "false"
MODEL_FREE_CONFIRMED = "false"
DATA_PROTECTION_CONFIRMED = "false"
# Hard safety gate: only 4 server-owned fictional scenario IDs are accepted.
BETA_SYNTHETIC_ONLY = "true"

# No ACCESS_AUD or QUOTA_HASH_SALT values here. They must be configured
# by the owner only after selecting Cloudflare Access on the Free plan.
# The Worker refuses inference unless Access authenticates the request.

[[durable_objects.bindings]]
name = "GLOBAL_QUOTA"
class_name = "CopilotQuota"

# Workers Free supports SQLite-backed Durable Objects, not legacy KV backend.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["CopilotQuota"]
