name: MANZO AI M3 Isolated Catalog QA

on:
  pull_request:
    paths:
      - 'product/migration/**'
      - 'product/backend/migrations/0004_public_catalog_m3.sql'
      - 'docs/MANZO_AI_M3_EXECUTION_REPORT_2026-11-16.md'
      - '.github/workflows/m3-isolated-catalog-qa.yml'
  push:
    branches: [main]
    paths:
      - 'product/migration/**'
      - 'product/backend/migrations/0004_public_catalog_m3.sql'
      - 'docs/MANZO_AI_M3_EXECUTION_REPORT_2026-11-16.md'
      - '.github/workflows/m3-isolated-catalog-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m3-ephemeral-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: m3_ephemeral_test_only
          POSTGRES_DB: manzo_ai_m3_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d manzo_ai_m3_qa"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 8
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: m3_ephemeral_test_only
      PGDATABASE: manzo_ai_m3_qa
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned JSON Schema validator and Postgres client
        run: |
          set -euo pipefail
          python3 -m pip install 'jsonschema==4.26.0'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Validate source catalog and CLI guards
        run: |
          set -euo pipefail
          python3 -m unittest discover -s product/migration -p 'test_*.py' -v
          python3 product/migration/build_catalog.py \
            --root . --output /tmp/manzo-ai-m3-metadata.json
      - name: Prepare isolated Postgres with Supabase-like roles
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          SQL
          psql -v ON_ERROR_STOP=1 -f product/backend/migrations/0004_public_catalog_m3.sql
      - name: Prove rollback mode leaves zero persistent rows
        run: |
          set -euo pipefail
          python3 product/migration/prepare_m3_sql.py \
            --root . --source-revision "$GITHUB_SHA" \
            --output /tmp/manzo-ai-m3-dryrun.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/manzo-ai-m3-dryrun.sql
          state=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT count(*) FROM content_public.catalog_courses)::text || ':' || (SELECT count(*) FROM content_public.catalog_localizations)::text || ':' || (SELECT count(*) FROM content_public.catalog_units)::text || ':' || (SELECT count(*) FROM content_internal.import_runs)::text")
          test "$state" = "0:0:0:0"
          echo 'PASS: rollback left no persistent rows'
      - name: Import twice in disposable Postgres — idempotence and integrity
        env:
          MANZO_M3_EPHEMERAL_DATABASE: isolated-ci-only
        run: |
          set -euo pipefail
          python3 product/migration/prepare_m3_sql.py \
            --root . --source-revision "$GITHUB_SHA" \
            --mode commit --ci-ephemeral-confirm \
            --output /tmp/manzo-ai-m3-ephemeral.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/manzo-ai-m3-ephemeral.sql
          before=$(psql -v ON_ERROR_STOP=1 -Atc "select md5(string_agg(row_to_json(x)::text,'|' order by x.course_key,x.locale)) from (select course_key,locale,title,source_sha256,updated_at from content_public.catalog_localizations) x")
          psql -v ON_ERROR_STOP=1 -f /tmp/manzo-ai-m3-ephemeral.sql
          after=$(psql -v ON_ERROR_STOP=1 -Atc "select md5(string_agg(row_to_json(x)::text,'|' order by x.course_key,x.locale)) from (select course_key,locale,title,source_sha256,updated_at from content_public.catalog_localizations) x")
          test "$before" = "$after"
          state=$(psql -v ON_ERROR_STOP=1 -Atc "SELECT (SELECT count(*) FROM content_public.catalog_courses)::text || ':' || (SELECT count(*) FROM content_public.catalog_localizations)::text || ':' || (SELECT count(*) FROM content_public.catalog_units)::text || ':' || (SELECT count(*) FROM content_internal.import_runs)::text")
          test "$state" = "2:6:36:1"
          echo 'PASS: second import produces no duplicate and no updated_at drift'
      - name: RLS and privilege-denial tests
        run: |
          set -euo pipefail
          echo 'CHECK no accidental Data API access or select policies'
          grants=$(psql -v ON_ERROR_STOP=1 -Atc "
            SELECT (
              (SELECT count(*) FROM pg_policies WHERE schemaname IN ('content_public','content_internal')) = 0
              AND NOT has_schema_privilege('anon','content_public','USAGE')
              AND NOT has_schema_privilege('authenticated','content_public','USAGE')
              AND NOT has_schema_privilege('service_role','content_public','USAGE')
              AND NOT has_table_privilege('anon','content_public.catalog_courses','SELECT')
              AND NOT has_table_privilege('authenticated','content_public.catalog_localizations','SELECT')
              AND (SELECT count(*) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace
                   WHERE n.nspname IN ('content_public','content_internal') AND c.relkind='r'
                     AND c.relrowsecurity AND c.relforcerowsecurity) = 4
            )::text")
          test "$grants" = "true"
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE anon; SELECT * FROM content_public.catalog_courses" >/tmp/m3-denied.log 2>&1; then
            echo 'ERROR: anon unexpectedly accessed catalog' >&2; exit 1
          fi
          grep -qi 'permission denied' /tmp/m3-denied.log
          if psql -v ON_ERROR_STOP=1 -c "SET ROLE authenticated; SELECT * FROM content_public.catalog_units" >/tmp/m3-denied.log 2>&1; then
            echo 'ERROR: authenticated unexpectedly accessed catalog' >&2; exit 1
          fi
          grep -qi 'permission denied' /tmp/m3-denied.log
          echo 'PASS: schema denied to anonymous and authenticated roles'
      - name: Produce test evidence artifact
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -Atc "
          SELECT json_build_object(
             'environment','ephemeral_postgres_16_only',
             'live_supabase_changed',false,
             'courses',(select count(*) from content_public.catalog_courses),
             'localizations',(select count(*) from content_public.catalog_localizations),
             'units',(select count(*) from content_public.catalog_units),
             'import_runs',(select count(*) from content_internal.import_runs),
             'rls_forced_tables',(select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname in ('content_public','content_internal') and c.relkind='r' and c.relrowsecurity and c.relforcerowsecurity)
          )::text" > /tmp/manzo-m3-evidence.json
          python3 -m json.tool /tmp/manzo-m3-evidence.json >/dev/null
      - name: Store review evidence (never part of GitHub Pages)
        uses: actions/upload-artifact@v4
        with:
          name: manzo-ai-m3-isolated-import-evidence
          path: /tmp/manzo-m3-evidence.json
          retention-days: 14
          if-no-files-found: error
