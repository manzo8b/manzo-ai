name: MANZO AI SaaS Database Security QA

on:
  pull_request:
    paths:
      - 'product/backend/**'
      - 'product/core/**'
      - '.github/workflows/saas-foundation-qa.yml'
  push:
    branches: [main]
    paths:
      - 'product/backend/**'
      - 'product/core/**'
      - '.github/workflows/saas-foundation-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci_test_only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python policy and webhook signature contracts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s product/core/tests -v
          python3 -m unittest discover -s product/backend/tests -p 'test_*.py' -v
      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
      - name: Apply schema on ephemeral PostgreSQL
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f product/backend/tests/000_auth_fixture.sql
          psql -v ON_ERROR_STOP=1 -f product/backend/migrations/0001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f product/backend/migrations/0002_learning_b2b.sql
      - name: Execute cross-tenant RLS and billing isolation assertions
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f product/backend/tests/010_rls_checks.sql
          psql -v ON_ERROR_STOP=1 -f product/backend/tests/020_learning_b2b_flows.sql
      - name: Verify atomic seat assignment under concurrent connections
        run: |
          set -euo pipefail
          python3 product/backend/tests/learning_seat_concurrency_smoke.py
      - name: Security contract result
        run: |
          echo "Verified only: ephemeral Postgres schema, tenant RLS, Learning B2B workflows, private billing tables and Python policies."
          echo "Not verified: production authentication, Supabase project configuration, external billing, PCI/GDPR, or live deployments."
