name: MANZO AI Chromatic QA

on:
  push:
    branches: [main]
    paths:
      - 'theme/mobile-nav.js'
      - 'theme/mobile-nav.css'
      - 'theme/publish-navigation.py'
      - 'theme/mobile-browser-smoke.py'
      - '.github/workflows/theme-qa.yml'
  pull_request:
    paths:
      - 'theme/**'
      - 'product/preview/**'
      - 'product/core/**'
      - '.github/workflows/deploy-pages.yml'
      - '.github/workflows/theme-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify offline SaaS entitlement contracts
        run: |
          python3 -m unittest discover -s product/core/tests -v
      - name: Extract latest approved release and apply ONLY the visual overlay
        shell: bash
        run: |
          set -euo pipefail
          unzip -t site-v0.7.zip >/dev/null
          mkdir -p _site
          unzip -q site-v0.7.zip -d _site
          printf '\n' >> _site/style.css
          cat theme/learning-colors.css >> _site/style.css
          python3 theme/check-theme.py --site _site --archive site-v0.7.zip --theme theme/learning-colors.css
          mkdir -p _site/assets
          cp theme/manzo-mark.svg _site/assets/manzo-mark.svg
          cat theme/footer-signature.css >> _site/style.css
          python3 theme/inject-signature.py --site _site
          python3 theme/inject-signature.py --site _site --verify-only
          python3 theme/publish-oracle-city.py --site _site --edition editorial/oracle-city/numero-01
          python3 theme/publish-podcast.py --site _site --edition editorial/podcast/ep00
          python3 theme/publish-prompt-video.py --site _site --edition editorial/video/prompt-engineering
          python3 -m py_compile theme/publish-hallucinations.py theme/hallucinations-browser-smoke.py
          node --check editorial/learning/hallucinations/course.js
          python3 theme/publish-hallucinations.py --site _site
          python3 theme/publish-hallucinations.py --site _site --verify-only
          python3 -m py_compile theme/publish-hallucinations-coding.py theme/hallucinations-coding-browser-smoke.py
          node --check editorial/learning/hallucinations/coding.js
          python3 theme/publish-hallucinations-coding.py --site _site
          python3 theme/publish-hallucinations-coding.py --site _site --verify-only
          python3 -m py_compile theme/publish-product-preview.py theme/product-preview-browser-smoke.py
          node --check product/preview/preview.js
          python3 theme/publish-product-preview.py --site _site
          python3 theme/publish-product-preview.py --site _site --verify-only
          python3 theme/build-seo.py --site _site --base-url "https://manzo8b.github.io/manzo-ai/"
          node --check theme/mobile-nav.js
          python3 theme/publish-navigation.py --site _site
          python3 theme/publish-navigation.py --site _site --verify-only
      - name: Install Chromium for responsive smoke tests
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install chromium
      - name: Test visual differentiation, URLs and mobile behavior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _preview
          ln -s ../_site _preview/manzo-ai
          python3 -m http.server 8765 --bind 127.0.0.1 --directory _preview >/tmp/manzo-http.log 2>&1 &
          python3 theme/browser-smoke.py
          python3 theme/mobile-browser-smoke.py
          python3 theme/hallucinations-browser-smoke.py
          python3 theme/hallucinations-coding-browser-smoke.py
          python3 theme/product-preview-browser-smoke.py
