          grep -q 'data-ma-home-course="modelli-mentali-affidabilita"' _site/it/index.html
          grep -q 'data-ma-home-course="ai-product-builder-centroni-city"' _site/it/index.html
          test -s _site/assets/centroni-city-course.css
