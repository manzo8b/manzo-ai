name: MANZO AI Home Magic V2 — Trilingual Staging QA
on:
  push:
    branches:
      - preview/home-magic-trilingual-v2
    paths:
      - theme/publish-home-magic-v2.py
      - theme/home-magic-v2.css
      - theme/home-magic-v2.js
      - theme/home-magic-v2-browser-smoke.py
      - .github/workflows/home-magic-v2-preview.yml
permissions:
  contents: read
concurrency:
  group: manzo-ai-home-v2-preview
  cancel-in-progress: true
jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    # Ubuntu 24.04 is supported by Playwright 1.55; ubuntu-latest currently selects an unsupported image.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Keep original media commit timestamp for VideoObject.uploadDate
      - name: Validate zero-cost private Mission Copilot prototype
        shell: bash
        run: |
          set -euo pipefail
          node --check product/mission-copilot/worker.mjs
          node --check product/mission-copilot/worker.test.mjs
          node --check product/mission-copilot/zero-euro-preflight.mjs
          node --check product/mission-copilot/zero-euro-preflight.test.mjs
          node --test product/mission-copilot/worker.test.mjs
          node --test product/mission-copilot/zero-euro-preflight.test.mjs
          node product/mission-copilot/zero-euro-preflight.mjs > /tmp/mission-copilot-preflight.json
          grep -q '"status": "BLOCKED_NOT_CONNECTED"' /tmp/mission-copilot-preflight.json
          grep -q '"configSafe": true' /tmp/mission-copilot-preflight.json
          # P1 is only a local simulation behind ?copilot=preview.
          # Never add Cloudflare credentials or an endpoint to GitHub Pages.
          node --check tools/ai-teaching-launchpad/mission-adapter.mjs
          node --check tools/ai-teaching-launchpad/copilot-preview.mjs
          node --test tools/ai-teaching-launchpad/mission-adapter.test.mjs
          # All three activation gates remain OFF without explicit owner approval.
          grep -q 'COPILOT_ENABLED = "false"' product/mission-copilot/wrangler.toml
          grep -q 'FREE_PLAN_CONFIRMED = "false"' product/mission-copilot/wrangler.toml
          grep -q 'MODEL_FREE_CONFIRMED = "false"' product/mission-copilot/wrangler.toml
          grep -q 'DATA_PROTECTION_CONFIRMED = "false"' product/mission-copilot/wrangler.toml
          grep -q 'BETA_SYNTHETIC_ONLY = "true"' product/mission-copilot/wrangler.toml
          test -s product/mission-copilot/beta-scenarios.mjs
          node --check product/mission-copilot/beta-scenarios.mjs
          grep -q 'workers_dev = false' product/mission-copilot/wrangler.toml
          grep -q '^\[observability\]' product/mission-copilot/wrangler.toml
          grep -q '^\[observability.logs\]' product/mission-copilot/wrangler.toml
          grep -q '^invocation_logs = false' product/mission-copilot/wrangler.toml
          grep -q 'name = "GLOBAL_QUOTA"' product/mission-copilot/wrangler.toml
          grep -q 'class_name = "CopilotQuota"' product/mission-copilot/wrangler.toml
          grep -q 'new_sqlite_classes = \["CopilotQuota"\]' product/mission-copilot/wrangler.toml
          if grep -Eq '^\s*(ACCESS_AUD|QUOTA_HASH_SALT|PREVIEW_ACCESS_TOKEN)\s*=' product/mission-copilot/wrangler.toml; then
            echo "::error::Never commit Access keys or identity secrets"
            exit 1
          fi
          if grep -Eq '^[[:space:]]*(route|routes)[[:space:]]*=' product/mission-copilot/wrangler.toml; then
            echo "::error::Private Copilot cannot expose a Cloudflare route"
            exit 1
          fi
      - name: Check publication package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f site-v0.7.zip ]; then
            archive=site-v0.7.zip
          elif [ -f site-v0.6.zip ]; then
            archive=site-v0.6.zip
          elif [ -f site-v0.5.zip ]; then
            archive=site-v0.5.zip
          elif [ -f site-v0.4.zip ]; then
            archive=site-v0.4.zip
          elif [ -f site-v0.3.zip ]; then
            archive=site-v0.3.zip
          elif [ -f site-v0.2.zip ]; then
            archive=site-v0.2.zip
          elif [ -f site-v0.1.zip ]; then
            archive=site-v0.1.zip
          else
            echo "::error::No MANZO AI release archive found."
            exit 1
          fi
          echo "SITE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          unzip -t "$archive" >/dev/null
      - name: Check video thumbnail availability without external dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -s editorial/video/prompt-engineering/Prompt_Engineering.mp4 ] && ! command -v ffmpeg >/dev/null 2>&1; then
            # Thumbnail extraction is optional; the video page uses a branded poster
            # fallback. Network-dependent apt installs must not block educational releases.
            echo "::warning::FFmpeg unavailable: retaining playable video with branded poster fallback."
          fi
      - name: Install Markdown renderer for the open teacher course
        run: python3 -m pip install --disable-pip-version-check markdown==3.10
      - name: Extract and inspect static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -q "$SITE_ARCHIVE" -d _site
          # Visual-only patch over the established v0.7 package.
          # The archive remains the authoritative source for all 82 pages and assets.
          if [ "$SITE_ARCHIVE" = "site-v0.7.zip" ]; then
            test -s theme/learning-colors.css
            test -s theme/check-theme.py
            printf '\n' >> _site/style.css
            cat theme/learning-colors.css >> _site/style.css
            python3 theme/check-theme.py --site _site --archive "$SITE_ARCHIVE" --theme theme/learning-colors.css
            mkdir -p _site/assets
            cp theme/manzo-mark.svg _site/assets/manzo-mark.svg
            cat theme/footer-signature.css >> _site/style.css
            python3 theme/inject-signature.py --site _site
            python3 theme/inject-signature.py --site _site --verify-only
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.2.zip" ]; then
            for locale_path in it/academy es/academia en/academy it/risorse es/recursos en/resources it/video-e-slide es/videos-y-diapositivas en/videos-and-slides; do
              test -s "_site/$locale_path/index.html"
            done
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.3.zip" ]; then
            for new_page in it/prompt-mastery/che-cos-e-un-prompt es/prompt-mastery/que-es-un-prompt en/prompt-mastery/what-is-a-prompt; do
              test -s "_site/$new_page/index.html"
            done
            for lang in it es en; do
              test -s "_site/$lang/index.html"
            done
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.4.zip" ]; then
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            for n in 01-copertina 02-definizione-ai 03-machine-learning 04-ai-generativa 05-addestramento-e-risposta 06-vita-e-lavoro 07-esercizio 08-conclusioni; do
              test -s "_site/assets/slides/m01-it/$n.webp"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.5.zip" ]; then
            for course in \
              it/impara/come-funziona-un-modello-linguistico \
              it/impara/come-costruire-un-prompt-efficace \
              it/impara/come-verificare-le-risposte-ai \
              it/impara/progettare-un-workflow-ai \
              it/impara/ai-storia-lavoro-societa \
              es/aprende/como-funciona-un-modelo-de-lenguaje \
              es/aprende/como-construir-un-prompt-eficaz \
              es/aprende/como-verificar-las-respuestas-de-ia \
              es/aprende/disenar-un-flujo-de-trabajo-con-ia \
              es/aprende/ia-historia-trabajo-sociedad \
              en/learn/how-a-language-model-works \
              en/learn/how-to-build-an-effective-prompt \
              en/learn/how-to-verify-ai-answers \
              en/learn/designing-an-ai-workflow \
              en/learn/ai-history-work-and-society; do
              test -s "_site/$course/index.html"
              grep -q 'answer-reveal' "_site/$course/index.html"
            done
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            for n in 01-copertina 02-definizione-ai 03-machine-learning 04-ai-generativa 05-addestramento-e-risposta 06-vita-e-lavoro 07-esercizio 08-conclusioni; do
              test -s "_site/assets/slides/m01-it/$n.webp"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
            test "$(find _site -name index.html | wc -l)" -eq 52
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.6.zip" ]; then
            for path in it/pensiero-critico es/pensamiento-critico en/critical-thinking; do
              test -s "_site/$path/index.html"
            done
            for path in \
              it/pensiero-critico/cruciverba-affidabilita \
              it/pensiero-critico/cruciverba-fonti \
              it/pensiero-critico/cruciverba-governance \
              es/pensamiento-critico/crucigrama-fiabilidad \
              es/pensamiento-critico/crucigrama-fuentes \
              es/pensamiento-critico/crucigrama-gobernanza \
              en/critical-thinking/crossword-reliability \
              en/critical-thinking/crossword-sources \
              en/critical-thinking/crossword-governance; do
              test -s "_site/$path/index.html"
              grep -q 'id="cross-data"' "_site/$path/index.html"
            done
            for path in \
              it/pensiero-critico/notizie/ai-act \
              it/pensiero-critico/notizie/ai-istruzione \
              it/pensiero-critico/notizie/competenze-docenti \
              es/pensamiento-critico/noticias/ley-ia \
              es/pensamiento-critico/noticias/ia-educacion \
              es/pensamiento-critico/noticias/competencias-docentes \
              en/critical-thinking/news/ai-act \
              en/critical-thinking/news/ai-education \
              en/critical-thinking/news/teacher-skills; do
              test -s "_site/$path/index.html"
            done
            for path in \
              it/pensiero-critico/dilemmi/selezione-personale \
              it/pensiero-critico/dilemmi/apprendimento \
              es/pensamiento-critico/dilemas/seleccion-personal \
              es/pensamiento-critico/dilemas/aprendizaje \
              en/critical-thinking/dilemmas/recruitment \
              en/critical-thinking/dilemmas/learning; do
              test -s "_site/$path/index.html"
              grep -q 'id="dilemma-data"' "_site/$path/index.html"
            done
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
            test "$(find _site -name index.html | wc -l)" -eq 79
            test -s _site/app.js
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.7.zip" ]; then
            for path in it/prompt-mastery/laboratorio-tecnico es/prompt-mastery/laboratorio-tecnico en/prompt-mastery/technical-lab; do
              test -s "_site/$path/index.html"
              grep -q 'technical-article' "_site/$path/index.html"
              grep -q 'ysPbXH0LpIE' "_site/$path/index.html"
            done
            for document in golden_cases.json predictions_example.json check_outputs.py; do
              test -s "_site/assets/prompting101/$document"
            done
            python3 "_site/assets/prompting101/check_outputs.py" "_site/assets/prompting101/golden_cases.json" "_site/assets/prompting101/predictions_example.json"
            for old_resource in it/pensiero-critico es/pensamiento-critico en/critical-thinking it/impara/come-costruire-un-prompt-efficace es/aprende/como-construir-un-prompt-eficaz en/learn/how-to-build-an-effective-prompt; do
              test -s "_site/$old_resource/index.html"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
            test "$(find _site -name index.html | wc -l)" -eq 82
          fi
          test -s _site/index.html
          test -s _site/it/index.html
          test -s _site/es/index.html
          test -s _site/en/index.html
          test -s _site/it/impara/che-cos-e-l-intelligenza-artificiale/index.html
          test -s _site/style.css
          test -s _site/app.js
          test -s _site/logo.svg
          test -s _site/sitemap.xml
          test -f _site/.nojekyll
          python3 theme/publish-oracle-city.py --site _site --edition editorial/oracle-city/numero-01
          python3 theme/publish-podcast.py --site _site --edition editorial/podcast/ep00
          python3 -m py_compile theme/publish-prompt-video.py
          python3 theme/publish-prompt-video.py --site _site --edition editorial/video/prompt-engineering
          if [ -s editorial/video/prompt-engineering/Prompt_Engineering.mp4 ]; then
            test -s _site/assets/media/prompt-engineering/Prompt_Engineering.mp4
            test -s _site/it/video-e-slide/prompt-engineering/index.html
            # A frame-extracted JPG is optional when ffmpeg is unavailable.
            # A valid branded fallback poster must always remain on the video page.
            grep -Eq 'poster="/manzo-ai/(logo.svg|assets/media/prompt-engineering/copertina.jpg)"' _site/it/video-e-slide/prompt-engineering/index.html
          fi
          # Add the trilingual research dossier and hub links before canonical/SEO generation.
          python3 -m py_compile theme/publish-acr-dossier.py
          python3 theme/publish-acr-dossier.py --site _site
          for research_page in it/ricerca/acr en/research/acr es/investigacion/acr; do
            test -s "_site/$research_page/index.html"
            grep -q 'data-acr-dossier' "_site/$research_page/index.html"
          done
          test -s _site/assets/research/acr/dossier.css
          test -s _site/assets/research/acr/dossier.js
          # Deploy the professional course in all three portal languages.
          python3 -m py_compile theme/publish-hallucinations.py
          node --check editorial/learning/hallucinations/course.js
          python3 theme/publish-hallucinations.py --site _site
          python3 theme/publish-hallucinations.py --site _site --verify-only
          # Editorial Engineering Assurance module: publish after the base course.
          python3 -m py_compile theme/publish-hallucinations-coding.py
          node --check editorial/learning/hallucinations/coding.js
          python3 theme/publish-hallucinations-coding.py --site _site
          python3 theme/publish-hallucinations-coding.py --site _site --verify-only
          # New learning scaffolding uses only the already published content.
          python3 -m py_compile theme/publish-learning-experience.py
          node --check product/learning-experience/guide.js
          python3 theme/publish-learning-experience.py --site _site
          python3 theme/publish-learning-experience.py --site _site --verify-only
          for coding_page in it/impara/allucinazioni-ai-verificabilita/coding en/learn/ai-hallucinations-verification/coding es/aprende/alucinaciones-ia-verificacion/coding; do
            test -s "_site/$coding_page/index.html"
            grep -q 'data-hc-module' "_site/$coding_page/index.html"
          done
          for course_page in it/impara/allucinazioni-ai-verificabilita en/learn/ai-hallucinations-verification es/aprende/alucinaciones-ia-verificacion; do
            test -s "_site/$course_page/index.html"
            grep -q 'hx-quiz-data' "_site/$course_page/index.html"
            grep -q 'hx-cross-grid' "_site/$course_page/index.html"
          done
          # Publish the full Italian teacher course beta before SEO, without DB or certificates.
          python3 -m py_compile theme/publish-ai-teaching-lab.py
          node --check editorial/learning/ai-teaching-lab/preview/app.js
          python3 theme/publish-ai-teaching-lab.py --site _site
          python3 theme/publish-ai-teaching-lab.py --site _site --verify-only
          for n in 01 02 03 04 05; do
            test -s "_site/it/formazione/ia-per-la-didattica/modulo-$n/index.html"
          done
          test -s _site/it/formazione/ia-per-la-didattica/data/scenarios.json
          test -s _site/it/formazione/ia-per-la-didattica/studio-immagini/index.html
          test -s _site/it/formazione/ia-per-la-didattica/studio-voce/index.html
          test -s _site/it/formazione/ia-per-la-didattica/studio-video/index.html
          test -s _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          test -s _site/it/formazione/ia-per-la-didattica/inizia/index.html
          test -s _site/it/formazione/ia-per-la-didattica/inizia/mission-adapter.mjs
          test -s _site/it/formazione/ia-per-la-didattica/inizia/copilot-preview.mjs
          grep -q 'id="copilot-preview" hidden' _site/it/formazione/ia-per-la-didattica/inizia/index.html
          grep -q 'data-atl-launchpad="v0.1"' _site/it/formazione/ia-per-la-didattica/index.html
          grep -q 'ai-teaching-lab-mission-v0.1' _site/it/formazione/ia-per-la-didattica/inizia/index.html
          grep -q 'data-atl-workspace="v0.1"' _site/it/formazione/ia-per-la-didattica/index.html
          grep -q 'id="exportJSON"' _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          # Beginner-first pedagogy and guided navigation are release gates.
          grep -q 'id="guided-demo"' _site/it/formazione/ia-per-la-didattica/studio-immagini/index.html
          grep -q 'id="guided-demo"' _site/it/formazione/ia-per-la-didattica/studio-voce/index.html
          grep -q 'id="guided-demo"' _site/it/formazione/ia-per-la-didattica/studio-video/index.html
          grep -q 'id="sample-brief"' _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          grep -q 'id="wk-all"' _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          # Mobile first: content before status, concise disclosure and assisted inputs.
          grep -q 'data-atl-workspace="1"' _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          grep -q 'class="mobile-guide"' _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          grep -q 'class="example-detail"' _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          grep -q 'class="card workspace-section"' _site/it/formazione/ia-per-la-didattica/workspace-multimediale/index.html
          node --check theme/check-ai-teaching-lab-contracts.cjs
          node theme/check-ai-teaching-lab-contracts.cjs --site _site
          grep -q 'class="field-guide"' _site/it/formazione/ia-per-la-didattica/studio-immagini/index.html
          grep -q 'class="field-guide"' _site/it/formazione/ia-per-la-didattica/studio-voce/index.html
          grep -q 'class="field-guide"' _site/it/formazione/ia-per-la-didattica/studio-video/index.html
          grep -q 'data-atl-video-studio="v0.1"' _site/it/formazione/ia-per-la-didattica/index.html
          grep -q 'id="captions"' _site/it/formazione/ia-per-la-didattica/studio-video/index.html
          grep -q 'data-atl-voice-studio="v0.1"' _site/it/formazione/ia-per-la-didattica/index.html
          grep -q 'id="transcript"' _site/it/formazione/ia-per-la-didattica/studio-voce/index.html
          grep -q 'data-atl-image-studio="v0.1"' _site/it/formazione/ia-per-la-didattica/index.html
          grep -q 'id="approve"' _site/it/formazione/ia-per-la-didattica/studio-immagini/index.html
          # Product preview is deliberately nontransactional and noindex.
          python3 -m py_compile theme/publish-product-preview.py
          node --check product/preview/preview.js
          python3 theme/publish-product-preview.py --site _site
          python3 theme/publish-product-preview.py --site _site --verify-only
          for preview_page in it/prodotto en/product es/producto; do
            test -s "_site/$preview_page/index.html"
            grep -q 'noindex,follow' "_site/$preview_page/index.html"
            grep -q 'data-product-preview' "_site/$preview_page/index.html"
          done
          # Learning B2B dashboard is a nontransactional, noindex simulation.
          python3 -m py_compile theme/publish-learning-console.py
          node --check product/learning-console/console.js
          python3 theme/publish-learning-console.py --site _site
          python3 theme/publish-learning-console.py --site _site --verify-only
          for learning_page in it/prodotto/learning-b2b en/product/learning-b2b es/producto/learning-b2b; do
            test -s "_site/$learning_page/index.html"
            grep -q 'noindex,follow' "_site/$learning_page/index.html"
            grep -q 'data-learning-console' "_site/$learning_page/index.html"
          done
          # Once the account is renamed, update built HTML/SEO URLs without changing the source ZIP.
          python3 theme/rewrite-owner-urls.py --site _site --old-owner manzo8b --new-owner "$GITHUB_REPOSITORY_OWNER"
          # Independent creator/methodology pages must be indexed by the real sitemap.
          python3 -m py_compile theme/publish-about.py
          python3 theme/publish-about.py --site _site
          python3 theme/publish-about.py --site _site --verify-only
          # Generate final SEO index ONLY after all published editorial pages exist.
          python3 theme/build-seo.py --site _site --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/manzo-ai/"
          # Prompt vs Skill diagrams, including the visible four-child family reasoning map.
          python3 -m py_compile theme/prompt_skill_visuals.py theme/publish-prompt-skill-course.py
          python3 theme/publish-prompt-skill-course.py --site _site --verify-only
          python3 -m py_compile theme/prompt_skill_i18n.py theme/publish-prompt-skill-translations.py theme/publish-prompt-skill-translated-home.py
          python3 theme/publish-prompt-skill-translations.py --site _site --verify-only
          node --check theme/prompt-skill-translated.js
          python3 -m py_compile theme/publish-reliability-course.py
          python3 theme/publish-reliability-course.py --site _site --verify-only
          python3 -m py_compile theme/publish-centroni-city-course.py
          python3 theme/publish-centroni-city-course.py --site _site --verify-only
          python3 -m py_compile theme/legacy_learning_i18n.py theme/publish-legacy-course-translations.py theme/publish-legacy-course-home.py
          node --check theme/legacy-learning-i18n.js
          python3 theme/publish-legacy-course-translations.py --site _site --verify-only
          python3 -m py_compile theme/build_safely_i18n.py theme/build_safely_evaluations.py theme/publish-build-safely-course.py theme/publish-build-safely-home.py
          python3 theme/publish-build-safely-course.py --site _site --verify-only
