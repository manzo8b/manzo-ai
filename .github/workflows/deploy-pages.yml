name: Deploy MANZO AI

on:
  push:
    branches: [main]
    paths:
      - site-v0.1.zip
      - site-v0.2.zip
      - site-v0.3.zip
      - site-v0.4.zip
      - site-v0.5.zip
      - site-v0.6.zip
      - site-v0.7.zip
      - editorial/oracle-city/**
      - editorial/podcast/**
      - editorial/video/prompt-engineering/**
      - theme/publish-podcast.py
      - theme/publish-prompt-video.py
      - theme/publish-oracle-city.py
      - theme/learning-colors.css
      - theme/check-theme.py
      - theme/manzo-mark.svg
      - theme/inject-signature.py
      - theme/footer-signature.css
      - theme/rewrite-owner-urls.py
      - theme/build-seo.py
      - theme/mobile-nav.js
      - theme/mobile-nav.css
      - theme/publish-navigation.py
      - googlee8540704606dd6ec.html
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: manzo-ai-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Keep original media commit timestamp for VideoObject.uploadDate
      - name: Check publication package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f site-v0.7.zip ]; then
            archive=site-v0.7.zip
          elif [ -f site-v0.6.zip ]; then
            archive=site-v0.6.zip
          elif [ -f site-v0.5.zip ]; then
            archive=site-v0.5.zip
          elif [ -f site-v0.4.zip ]; then
            archive=site-v0.4.zip
          elif [ -f site-v0.3.zip ]; then
            archive=site-v0.3.zip
          elif [ -f site-v0.2.zip ]; then
            archive=site-v0.2.zip
          elif [ -f site-v0.1.zip ]; then
            archive=site-v0.1.zip
          else
            echo "::error::No MANZO AI release archive found."
            exit 1
          fi
          echo "SITE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          unzip -t "$archive" >/dev/null
      - name: Ensure FFmpeg for video lesson thumbnail
        shell: bash
        run: |
          set -euo pipefail
          if [ -s editorial/video/prompt-engineering/Prompt_Engineering.mp4 ] && ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Extract and inspect static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -q "$SITE_ARCHIVE" -d _site
          # Visual-only patch over the established v0.7 package.
          # The archive remains the authoritative source for all 82 pages and assets.
          if [ "$SITE_ARCHIVE" = "site-v0.7.zip" ]; then
            test -s theme/learning-colors.css
            test -s theme/check-theme.py
            printf '\n' >> _site/style.css
            cat theme/learning-colors.css >> _site/style.css
            python3 theme/check-theme.py --site _site --archive "$SITE_ARCHIVE" --theme theme/learning-colors.css
            mkdir -p _site/assets
            cp theme/manzo-mark.svg _site/assets/manzo-mark.svg
            cat theme/footer-signature.css >> _site/style.css
            python3 theme/inject-signature.py --site _site
            python3 theme/inject-signature.py --site _site --verify-only
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.2.zip" ]; then
            for locale_path in it/academy es/academia en/academy it/risorse es/recursos en/resources it/video-e-slide es/videos-y-diapositivas en/videos-and-slides; do
              test -s "_site/$locale_path/index.html"
            done
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.3.zip" ]; then
            for new_page in it/prompt-mastery/che-cos-e-un-prompt es/prompt-mastery/que-es-un-prompt en/prompt-mastery/what-is-a-prompt; do
              test -s "_site/$new_page/index.html"
            done
            for lang in it es en; do
              test -s "_site/$lang/index.html"
            done
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.4.zip" ]; then
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            for n in 01-copertina 02-definizione-ai 03-machine-learning 04-ai-generativa 05-addestramento-e-risposta 06-vita-e-lavoro 07-esercizio 08-conclusioni; do
              test -s "_site/assets/slides/m01-it/$n.webp"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.5.zip" ]; then
            for course in \
              it/impara/come-funziona-un-modello-linguistico \
              it/impara/come-costruire-un-prompt-efficace \
              it/impara/come-verificare-le-risposte-ai \
              it/impara/progettare-un-workflow-ai \
              it/impara/ai-storia-lavoro-societa \
              es/aprende/como-funciona-un-modelo-de-lenguaje \
              es/aprende/como-construir-un-prompt-eficaz \
              es/aprende/como-verificar-las-respuestas-de-ia \
              es/aprende/disenar-un-flujo-de-trabajo-con-ia \
              es/aprende/ia-historia-trabajo-sociedad \
              en/learn/how-a-language-model-works \
              en/learn/how-to-build-an-effective-prompt \
              en/learn/how-to-verify-ai-answers \
              en/learn/designing-an-ai-workflow \
              en/learn/ai-history-work-and-society; do
              test -s "_site/$course/index.html"
              grep -q 'answer-reveal' "_site/$course/index.html"
            done
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            for n in 01-copertina 02-definizione-ai 03-machine-learning 04-ai-generativa 05-addestramento-e-risposta 06-vita-e-lavoro 07-esercizio 08-conclusioni; do
              test -s "_site/assets/slides/m01-it/$n.webp"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
            test "$(find _site -name index.html | wc -l)" -eq 52
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.6.zip" ]; then
            for path in it/pensiero-critico es/pensamiento-critico en/critical-thinking; do
              test -s "_site/$path/index.html"
            done
            for path in \
              it/pensiero-critico/cruciverba-affidabilita \
              it/pensiero-critico/cruciverba-fonti \
              it/pensiero-critico/cruciverba-governance \
              es/pensamiento-critico/crucigrama-fiabilidad \
              es/pensamiento-critico/crucigrama-fuentes \
              es/pensamiento-critico/crucigrama-gobernanza \
              en/critical-thinking/crossword-reliability \
              en/critical-thinking/crossword-sources \
              en/critical-thinking/crossword-governance; do
              test -s "_site/$path/index.html"
              grep -q 'id="cross-data"' "_site/$path/index.html"
            done
            for path in \
              it/pensiero-critico/notizie/ai-act \
              it/pensiero-critico/notizie/ai-istruzione \
              it/pensiero-critico/notizie/competenze-docenti \
              es/pensamiento-critico/noticias/ley-ia \
              es/pensamiento-critico/noticias/ia-educacion \
              es/pensamiento-critico/noticias/competencias-docentes \
              en/critical-thinking/news/ai-act \
              en/critical-thinking/news/ai-education \
              en/critical-thinking/news/teacher-skills; do
              test -s "_site/$path/index.html"
            done
            for path in \
              it/pensiero-critico/dilemmi/selezione-personale \
              it/pensiero-critico/dilemmi/apprendimento \
              es/pensamiento-critico/dilemas/seleccion-personal \
              es/pensamiento-critico/dilemas/aprendizaje \
              en/critical-thinking/dilemmas/recruitment \
              en/critical-thinking/dilemmas/learning; do
              test -s "_site/$path/index.html"
              grep -q 'id="dilemma-data"' "_site/$path/index.html"
            done
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
            test "$(find _site -name index.html | wc -l)" -eq 79
            test -s _site/app.js
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.7.zip" ]; then
            for path in it/prompt-mastery/laboratorio-tecnico es/prompt-mastery/laboratorio-tecnico en/prompt-mastery/technical-lab; do
              test -s "_site/$path/index.html"
              grep -q 'technical-article' "_site/$path/index.html"
              grep -q 'ysPbXH0LpIE' "_site/$path/index.html"
            done
            for document in golden_cases.json predictions_example.json check_outputs.py; do
              test -s "_site/assets/prompting101/$document"
            done
            python3 "_site/assets/prompting101/check_outputs.py" "_site/assets/prompting101/golden_cases.json" "_site/assets/prompting101/predictions_example.json"
            for old_resource in it/pensiero-critico es/pensamiento-critico en/critical-thinking it/impara/come-costruire-un-prompt-efficace es/aprende/como-construir-un-prompt-eficaz en/learn/how-to-build-an-effective-prompt; do
              test -s "_site/$old_resource/index.html"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
            test "$(find _site -name index.html | wc -l)" -eq 82
          fi
          test -s _site/index.html
          test -s _site/it/index.html
          test -s _site/es/index.html
          test -s _site/en/index.html
          test -s _site/it/impara/che-cos-e-l-intelligenza-artificiale/index.html
          test -s _site/style.css
          test -s _site/app.js
          test -s _site/logo.svg
          test -s _site/sitemap.xml
          test -f _site/.nojekyll
          python3 theme/publish-oracle-city.py --site _site --edition editorial/oracle-city/numero-01
          python3 theme/publish-podcast.py --site _site --edition editorial/podcast/ep00
          python3 -m py_compile theme/publish-prompt-video.py
          python3 theme/publish-prompt-video.py --site _site --edition editorial/video/prompt-engineering
          if [ -s editorial/video/prompt-engineering/Prompt_Engineering.mp4 ]; then
            test -s _site/assets/media/prompt-engineering/copertina.jpg
            test -s _site/it/video-e-slide/prompt-engineering/index.html
          fi
          # Once the account is renamed, update built HTML/SEO URLs without changing the source ZIP.
          python3 theme/rewrite-owner-urls.py --site _site --old-owner manzo8b --new-owner "$GITHUB_REPOSITORY_OWNER"
          # Generate final SEO index ONLY after all published editorial pages exist.
          python3 theme/build-seo.py --site _site --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/manzo-ai/"
          # Final enhancement on all rendered pages, including editorial media and language landing.
          node --check theme/mobile-nav.js
          python3 -m py_compile theme/publish-navigation.py
          python3 theme/publish-navigation.py --site _site
          python3 theme/publish-navigation.py --site _site --verify-only
          test -s _site/assets/mobile-nav.js
          test -s _site/assets/mobile-nav.css
          test -s _site/sitemap.xml
          test -s _site/it/mappa-del-sito/index.html
          test -s _site/es/mapa-del-sitio/index.html
          test -s _site/en/site-map/index.html
          # Ownership verification belongs at the root of the MANZO AI URL-prefix property.
          # Keep Google-provided filename and content exact across future deployments.
          test "$(cat googlee8540704606dd6ec.html)" = "google-site-verification: googlee8540704606dd6ec.html"
          cp googlee8540704606dd6ec.html _site/googlee8540704606dd6ec.html
          cmp googlee8540704606dd6ec.html _site/googlee8540704606dd6ec.html
          echo "Static files, SEO sitemap and Google verification validated."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Allow artifact metadata to become visible
        shell: bash
        run: |
          # Pages may query Actions before freshly uploaded artifact metadata has propagated.
          # This wait precedes deployment in a NEW workflow run; don't rerun a run with
          # the same artifact name, as it produces duplicate github-pages artifacts.
          sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
