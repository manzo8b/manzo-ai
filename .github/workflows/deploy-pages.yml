name: Deploy MANZO AI

on:
  push:
    branches: [main]
    paths:
      - site-v0.1.zip
      - site-v0.2.zip
      - site-v0.3.zip
      - site-v0.4.zip
      - site-v0.5.zip
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: manzo-ai-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check publication package
        shell: bash
        run: |
          set -euo pipefail
          if [ -f site-v0.5.zip ]; then
            archive=site-v0.5.zip
          elif [ -f site-v0.4.zip ]; then
            archive=site-v0.4.zip
          elif [ -f site-v0.3.zip ]; then
            archive=site-v0.3.zip
          elif [ -f site-v0.2.zip ]; then
            archive=site-v0.2.zip
          elif [ -f site-v0.1.zip ]; then
            archive=site-v0.1.zip
          else
            echo "::error::No MANZO AI release archive found."
            exit 1
          fi
          echo "SITE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          unzip -t "$archive" >/dev/null
      - name: Extract and inspect static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          unzip -q "$SITE_ARCHIVE" -d _site
          if [ "$SITE_ARCHIVE" = "site-v0.2.zip" ]; then
            for locale_path in it/academy es/academia en/academy it/risorse es/recursos en/resources it/video-e-slide es/videos-y-diapositivas en/videos-and-slides; do
              test -s "_site/$locale_path/index.html"
            done
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.3.zip" ]; then
            for new_page in it/prompt-mastery/che-cos-e-un-prompt es/prompt-mastery/que-es-un-prompt en/prompt-mastery/what-is-a-prompt; do
              test -s "_site/$new_page/index.html"
            done
            for lang in it es en; do
              test -s "_site/$lang/index.html"
            done
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.4.zip" ]; then
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            for n in 01-copertina 02-definizione-ai 03-machine-learning 04-ai-generativa 05-addestramento-e-risposta 06-vita-e-lavoro 07-esercizio 08-conclusioni; do
              test -s "_site/assets/slides/m01-it/$n.webp"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
          fi
          if [ "$SITE_ARCHIVE" = "site-v0.5.zip" ]; then
            for course in \
              it/impara/come-funziona-un-modello-linguistico \
              it/impara/come-costruire-un-prompt-efficace \
              it/impara/come-verificare-le-risposte-ai \
              it/impara/progettare-un-workflow-ai \
              it/impara/ai-storia-lavoro-societa \
              es/aprende/como-funciona-un-modelo-de-lenguaje \
              es/aprende/como-construir-un-prompt-eficaz \
              es/aprende/como-verificar-las-respuestas-de-ia \
              es/aprende/disenar-un-flujo-de-trabajo-con-ia \
              es/aprende/ia-historia-trabajo-sociedad \
              en/learn/how-a-language-model-works \
              en/learn/how-to-build-an-effective-prompt \
              en/learn/how-to-verify-ai-answers \
              en/learn/designing-an-ai-workflow \
              en/learn/ai-history-work-and-society; do
              test -s "_site/$course/index.html"
              grep -q 'answer-reveal' "_site/$course/index.html"
            done
            for slide_page in it/slides/che-cos-e-davvero-l-intelligenza-artificiale es/diapositivas/que-es-la-inteligencia-artificial en/slides/what-is-artificial-intelligence; do
              test -s "_site/$slide_page/index.html"
            done
            for n in 01-copertina 02-definizione-ai 03-machine-learning 04-ai-generativa 05-addestramento-e-risposta 06-vita-e-lavoro 07-esercizio 08-conclusioni; do
              test -s "_site/assets/slides/m01-it/$n.webp"
            done
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pdf
            test -s _site/assets/slides/m01-it/MANZO_AI_M01_Slide_IT_v1.0.pptx
            test "$(find _site -name index.html | wc -l)" -eq 52
          fi
          test -s _site/index.html
          test -s _site/it/index.html
          test -s _site/es/index.html
          test -s _site/en/index.html
          test -s _site/it/impara/che-cos-e-l-intelligenza-artificiale/index.html
          test -s _site/style.css
          test -s _site/app.js
          test -s _site/logo.svg
          test -s _site/sitemap.xml
          test -f _site/.nojekyll
          echo "Static files validated."
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
